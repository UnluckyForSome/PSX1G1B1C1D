name: Weekly Full Verification

on:
  schedule:
    # Run every Monday at midnight UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write  # Commits the weekly report

jobs:
  full-verification:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch full history for git log
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install alive-progress darkdetect lxml psutil pyside6 strictyaml validators requests Pillow

    - name: Fetch Retool (pinned)
      run: |
        git clone --depth 1 --branch v2.4.9 https://github.com/unexpectedpanda/retool.git tooling/retool

    - name: Run full verification
      run: |
        python verification/scripts/full-verification.py

    - name: Check for changes
      id: check-changes
      run: |
        # The script writes COMPLETION.md, the README's progress bars and verification/
        # (modified or new files; tooling/ is git-ignored)
        git status --porcelain -- COMPLETION.md README.md verification/
        if [ -z "$(git status --porcelain -- COMPLETION.md README.md verification/)" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

        # Stage exactly the paths the previous step checked
        git add COMPLETION.md README.md verification/
        git commit -m "Weekly full verification report [automated]"

        # Rebase onto anything pushed meanwhile, then push
        git pull --rebase origin main
        git push origin main


